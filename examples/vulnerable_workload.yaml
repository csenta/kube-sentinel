apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api-backend
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-api
  template:
    metadata:
      labels:
        app: legacy-api
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: backend-sa
      containers:
        - name: api-server
          image: internal/legacy-api:1.0.0
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
